<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><title>学习统计 · 考研英语</title>
<style>
:root{--ink:#2c3038;--sub:#6b7280;--line:#e4ddcd;--bg:#f5f2ea;--card:#fffdf8;--blue:#2b6ef2;--red:#7a2a24;--grn:#1b7f3b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.7}
.wrap{max-width:960px;margin:0 auto;padding:28px 18px 70px}
h1{font-size:24px;margin:0 0 4px}.lead{color:var(--sub);font-size:13.5px;margin:0 0 8px}
a.back{color:var(--blue);text-decoration:none;font-size:14px}
h2{font-size:18px;margin:26px 0 10px;border-left:5px solid var(--red);padding-left:10px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi b{display:block;font-size:26px;color:#123a6b;line-height:1.2}
.kpi span{font-size:12.5px;color:var(--sub)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:10px 0}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
table.tbl th,table.tbl td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left}
table.tbl th{color:var(--sub);font-weight:600}
.heat{display:flex;flex-wrap:wrap;gap:3px}
.heat .c{width:15px;height:15px;border-radius:3px;background:#ece5d3}
.heat .c.l1{background:#cfe9d6}.heat .c.l2{background:#8fcea3}.heat .c.l3{background:#4fae6e}.heat .c.l4{background:#1b7f3b}
.heat .c.today{outline:2px solid #c0392b}
.legend{font-size:12px;color:var(--sub);margin-top:6px}
.bar{height:9px;background:#e7e0cf;border-radius:5px;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#2b6ef2,#1b7f3b)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.tools button{border:1px solid var(--line);background:#fff;color:#234f7a;border-radius:12px;padding:6px 12px;cursor:pointer;font-size:13px}
.tools .danger{color:#c0392b;border-color:#e0c0c0}
.wrong a{color:#c0392b;text-decoration:none}.wrong li{margin:3px 0;font-size:13px}
.tip{background:#eef4ff;border:1px solid #c9dcff;border-radius:12px;padding:10px 14px;font-size:13px;color:#33456a;margin:12px 0}
html.theme-dark{--ink:#e6e9ef;--sub:#a9b2c0;--line:#2c3442;--bg:#0f1319;--card:#151b24}
html.theme-dark table.tbl th,html.theme-dark table.tbl td{border-color:#2c3442}
html.theme-dark .kpi b{color:#9fc3ff}html.theme-dark .heat .c{background:#2a3342}
html.theme-dark .bar{background:#2a3342}
@media print{.tools{display:none}}
</style></head><body><div class="wrap">
<h1>📊 学习统计</h1>
<p class="lead">汇总本机学习记录（同一浏览器/域名下共享）。数据仅存本机，可导出备份。</p>
<p><a class="back" href="kaoyan-hub.html">← 考研资料中心</a>　·　<a class="back" href="kaoyan-tasks.html">任务打卡</a>　·　<a class="back" href="index.html">首页</a></p>

<div class="cards" id="kpis"></div>

<h2>学习活动（近 12 周）</h2>
<div class="panel"><div class="heat" id="heat"></div>
<div class="legend">颜色越深表示当天学习记录越多；红框为今天。</div></div>

<h2>分模块作答</h2>
<div class="panel"><table class="tbl" id="mods"><thead><tr><th>模块</th><th>已答</th><th>答对</th><th>正确率</th></tr></thead><tbody></tbody></table></div>

<h2>薄弱点诊断</h2>
<div class="panel" id="diag"></div>

<h2>错题清单</h2>
<div class="panel wrong" id="wrong"></div>

<h2>生词本</h2>
<div class="panel" id="vocab"></div>

<div class="tools">
 <button id="expAll">导出全部数据(JSON)</button>
 <button id="expLog">导出活动日志(CSV)</button>
 <button id="clrLog" class="danger">清除活动日志</button>
 <button id="clrAll" class="danger">清除全部学习数据</button>
</div>
<div class="tip">说明：答题正确率来自「作答记录」；热力图与学习天数来自「活动日志」（自本功能上线后累计）。换设备/清缓存不会同步，请用“导出全部数据”备份。</div>
</div>
<script>
function L(k,d){try{var v=JSON.parse(localStorage.getItem(k)||'');return (v==null?d:v);}catch(e){return d;}}
function S(k,o){try{localStorage.setItem(k,JSON.stringify(o));}catch(e){}}
function pad(n){return (n<10?'0':'')+n;}
function dstr(d){d=d||new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function pct(a,b){return b?Math.round(a*100/b)+'%':'—';}
function modOfQid(qid){
 if(/^r100-/.test(qid))return '阅读100篇';
 if(/^g001i-/.test(qid))return '考虫强化';
 if(/^g001-/.test(qid))return '考虫冲刺';
 if(/^cloze-/.test(qid))return '专项·完形';
 if(/^read-/.test(qid))return '专项·阅读';
 if(/^partb-/.test(qid))return '专项·新题型';
 if(/^transl-/.test(qid))return '专项·翻译';
 if(/^writing-/.test(qid))return '专项·写作';
 if(/^grammar-/.test(qid))return '专项·语法';
 if(/^cet4-/.test(qid))return '四级';
 return '其他';
}
function linkFor(qid){
 var m;
 if(m=qid.match(/^r100-(\d+)-(\d+)$/))return 'kaoyan-r100-'+m[1]+'.html#q'+m[1]+'-'+m[2];
 if(m=qid.match(/^g001-(\d+)-(\d+)$/))return 'kaoyan-g001-sprint.html#q'+m[1]+'-'+m[2];
 if(m=qid.match(/^g001i-(\d+)-(\d+)$/))return 'kaoyan-g001-intensive.html#q'+m[1]+'-'+m[2];
 if(/^cloze-/.test(qid))return 'kaoyan-drill-cloze.html';
 if(/^read-/.test(qid))return 'kaoyan-drill-read.html';
 if(/^partb-/.test(qid))return 'kaoyan-drill-partb.html';
 if(/^transl-/.test(qid))return 'kaoyan-drill-transl.html';
 if(/^writing-/.test(qid))return 'kaoyan-drill-writing.html';
 if(/^grammar-/.test(qid))return 'kaoyan-drill-grammar.html';
 return '';
}
function cet4Count(){
 var total=0;
 for(var i=0;i<localStorage.length;i++){
  var k=localStorage.key(i)||'';
  if(k.indexOf('cet4mc')===0||k.indexOf('seen:')===0||k.indexOf('cet4vbook')===0){
   var o=L(k,null); if(o&&typeof o==='object'){ total += Array.isArray(o)?o.length:Object.keys(o).length; }
  }
 }
 return total;
}
function render(){
 var LOG=L('kxlog',[])||[];
 var ANS=L('kxans',{})||{};
 var VOC=L('kxvocab',[])||[];
 var TASKS=L('kytasks',{})||{};
 var TXT=L('kxtxt',{})||{};
 // 作答
 var kxTotal=0,kxOk=0;
 for(var k in ANS){ if(!Object.prototype.hasOwnProperty.call(ANS,k))continue; var r=ANS[k]; kxTotal++; if(r&&typeof r==='object'&&r.ok)kxOk++; }
 var cet=cet4Count();
 // 打卡
 var HIST=TASKS.HIST||{}; var streak=0; var d=new Date(); if(!HIST[dstr(d)])d.setDate(d.getDate()-1);
 while(HIST[dstr(d)]){streak++;d.setDate(d.getDate()-1);}
 // 写作
 var wN=0,wWords=0; for(var tk in TXT){ if(!Object.prototype.hasOwnProperty.call(TXT,tk))continue; if(TXT[tk]){wN++; wWords+=(String(TXT[tk]).match(/[A-Za-z][A-Za-z'\-]*/g)||[]).length;} }
 // 学习天数
 var days={}; LOG.forEach(function(e){if(e&&e.d)days[e.d]=1;}); Object.keys(HIST).forEach(function(k){days[k]=1;});
 // 日志答题
 var logTotal=0,logOk=0,mods={};
 LOG.forEach(function(e){ if(!e||e.type!=='ans')return; logTotal++; if(e.ok)logOk++; var mm=e.mod||'其他'; mods[mm]=mods[mm]||{a:0,r:0}; mods[mm].a++; if(e.ok)mods[mm].r++; });
 if(!logTotal){ // 回退：用 kxans 的 qid 前缀
   for(var q in ANS){ if(!Object.prototype.hasOwnProperty.call(ANS,q))continue; var mm=modOfQid(q); mods[mm]=mods[mm]||{a:0,r:0}; mods[mm].a++; var rr=ANS[q]; if(rr&&typeof rr==='object'&&rr.ok)mods[mm].r++; }
 }
 // KPI
 var kxPct = logTotal?pct(logOk,logTotal):pct(kxOk,kxTotal);
 var kpis=[
   ['累计答题', kxTotal+cet, '作答记录（含四级/真题）'],
   ['正确率', kxPct, logTotal?('活动日志 '+logOk+'/'+logTotal):('作答记录 '+kxOk+'/'+kxTotal)],
   ['生词本', VOC.length, '点词“＋生词本”累计'],
   ['写作', wN+' 篇', '约 '+wWords+' 词'],
   ['连续打卡', streak+' 天', '每日任务全完成'],
   ['学习天数', Object.keys(days).length, '有记录的天数']
 ];
 document.getElementById('kpis').innerHTML=kpis.map(function(x){return '<div class="kpi"><b>'+esc(x[1])+'</b><span>'+esc(x[0])+' · '+esc(x[2])+'</span></div>';}).join('');
 // 热力图 84 天
 var byDay={}; LOG.forEach(function(e){if(e&&e.d)byDay[e.d]=(byDay[e.d]||0)+1;});
 Object.keys(HIST).forEach(function(k){byDay[k]=(byDay[k]||0)+1;});
 var cells=[]; var today=dstr();
 for(var i=83;i>=0;i--){ var dd=new Date(); dd.setDate(dd.getDate()-i); var ds=dstr(dd); var n=byDay[ds]||0; var lv=n===0?'':(n===1?'l1':n<=3?'l2':n<=6?'l3':'l4'); cells.push('<span class="c '+lv+(ds===today?' today':'')+'" title="'+ds+'：'+n+' 条"></span>'); }
 document.getElementById('heat').innerHTML=cells.join('');
 // 模块表
 var modHtml=Object.keys(mods).sort().map(function(mm){var o=mods[mm];return '<tr><td>'+esc(mm)+'</td><td>'+o.a+'</td><td>'+o.r+'</td><td>'+pct(o.r,o.a)+'</td></tr>';}).join('') || '<tr><td colspan="4" style="color:#8a94a3">暂无作答记录</td></tr>';
 document.getElementById('mods').querySelector('tbody').innerHTML=modHtml;
 // 薄弱点诊断：按题型
 var typStats={};
 LOG.forEach(function(e){ if(!e||e.type!=='ans'||!e.typ)return; var t=e.typ; typStats[t]=typStats[t]||{a:0,r:0}; typStats[t].a++; if(e.ok)typStats[t].r++; });
 var arr=Object.keys(typStats).map(function(t){return {t:t,a:typStats[t].a,r:typStats[t].r,acc:typStats[t].a?typStats[t].r/typStats[t].a:0};});
 arr.sort(function(x,y){return x.acc-y.acc;});
 var weak=arr.filter(function(x){return x.a>=3 && x.acc<0.7;});
 var show=weak.length?weak:arr.slice(0,3);
 function typLink(t){ if(!t)return 'kaoyan-drills.html';
   if(/完形|完型|选词/.test(t))return 'kaoyan-drill-cloze.html';
   if(/新题型|小标题|排序|选句|匹配/.test(t))return 'kaoyan-drill-partb.html';
   if(/翻译/.test(t))return 'kaoyan-drill-transl.html';
   if(/写作/.test(t))return 'kaoyan-drill-writing.html';
   if(/语法|长难句/.test(t))return 'kaoyan-drill-grammar.html';
   return 'kaoyan-drill-read.html';
 }
 var dg=document.getElementById('diag');
 if(show.length){
   var rows=show.map(function(x){return '<tr><td>'+esc(x.t)+'</td><td>'+x.a+'</td><td>'+x.r+'</td><td>'+pct(x.r,x.a)+'</td><td><a href="'+typLink(x.t)+'">去练 →</a></td></tr>';}).join('');
   dg.innerHTML='<p class="meta">依据活动日志中的题型作答自动诊断（样本≥3 且正确率<70% 视为薄弱；不足时显示正确率最低的前 3 项）。</p>'
     +'<table class="tbl"><thead><tr><th>题型</th><th>已答</th><th>答对</th><th>正确率</th><th>建议</th></tr></thead><tbody>'+rows+'</tbody></table>'
     +'<p style="margin-top:8px"><b>今日建议：</b>先练 <b>'+esc(show[0].t)+'</b>（正确率 '+pct(show[0].r,show[0].a)+'）：<a href="'+typLink(show[0].t)+'">立即去练 →</a></p>';
 } else {
   // 回退：模块级
   var marr=Object.keys(mods).map(function(m){var o=mods[m];return {m:m,a:o.a,r:o.r,acc:o.a?o.r/o.a:0};}).filter(function(x){return x.a>=3;}).sort(function(x,y){return x.acc-y.acc;});
   if(marr.length){ dg.innerHTML='<p class="meta">暂无题型级日志（做几道题后更准）。当前模块薄弱项：</p><p><b>'+esc(marr[0].m)+'</b>：正确率 '+pct(marr[0].r,marr[0].a)+' <a href="'+typLink(marr[0].m)+'">去练 →</a></p>'; }
   else dg.innerHTML='<span style="color:#8a94a3">还没有足够的作答记录。做完题后会自动生成薄弱点诊断。</span>';
 }
 // 错题
 var wrongs=[]; for(var q2 in ANS){ if(!Object.prototype.hasOwnProperty.call(ANS,q2))continue; var r2=ANS[q2]; if(r2&&typeof r2==='object'&&r2.ok===false)wrongs.push(q2); }
 wrongs.sort();
 var wh = wrongs.length ? '<b>共 '+wrongs.length+' 题</b><ul style="columns:2;margin:6px 0 0;padding-left:18px">'+wrongs.slice(0,300).map(function(q3){var lk=linkFor(q3);return '<li>'+(lk?'<a href="'+lk+'">'+esc(q3)+'</a>':esc(q3))+'</li>';}).join('')+'</ul>' : '<span style="color:#8a94a3">暂无错题 🎉</span>';
 document.getElementById('wrong').innerHTML=wh;
 // 生词
 var vh='共 <b>'+VOC.length+'</b> 个生词。最新：'+ (VOC.slice(-12).map(function(x){return esc(x&&x.w||'');}).join('、')||'—');
 document.getElementById('vocab').innerHTML=vh;
 window.__exportLog=function(){
   var rows=['date,type,module,ok'];
   LOG.forEach(function(e){rows.push([e.d,e.type,e.mod,(e.ok==null?'':e.ok)].join(','));});
   dl('学习活动日志.csv',rows.join('\n'),'text/csv');
 };
 window.__exportAll=function(){
   var keys=['kxlog','kxans','kxvocab','kytasks','kxtxt'];
   var out={exported:new Date().toISOString(),data:{}};
   keys.forEach(function(k){out.data[k]=L(k,null);});
   var extra={}; for(var i=0;i<localStorage.length;i++){var kk=localStorage.key(i)||''; if(kk.indexOf('cet4mc')===0||kk.indexOf('seen:')===0||kk.indexOf('cet4vbook')===0||kk.indexOf('wrong:')===0){extra[kk]=L(kk,null);}}
   out.data.extra=extra;
   dl('英语学习数据备份.json',JSON.stringify(out,null,1),'application/json');
 };
 function dl(name,text,type){var b=new Blob([text],{type:type+';charset=utf-8'});var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();setTimeout(function(){URL.revokeObjectURL(a.href);},2000);}
 document.getElementById('expAll').onclick=function(){window.__exportAll();};
 document.getElementById('expLog').onclick=function(){window.__exportLog();};
 document.getElementById('clrLog').onclick=function(){ if(confirm('清除活动日志（不影响作答/生词/打卡）？')){ localStorage.removeItem('kxlog'); render(); } };
 document.getElementById('clrAll').onclick=function(){ if(!confirm('清除全部学习数据（作答/生词/打卡/日志）？不可恢复！'))return;
   ['kxlog','kxans','kxvocab','kytasks','kxtxt'].forEach(function(k){localStorage.removeItem(k);});
   for(var i=localStorage.length-1;i>=0;i--){var kk=localStorage.key(i)||''; if(kk.indexOf('cet4mc')===0||kk.indexOf('seen:')===0||kk.indexOf('wrong:')===0||kk.indexOf('cet4vbook')===0)localStorage.removeItem(kk);}
   render();
 };
}
render();
</script>
<script src="auth.js"></script>
</body></html>

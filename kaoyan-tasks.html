<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><title>考研英语 · 学习任务清单</title>
<style>
:root{--ink:#2c3038;--sub:#6b7280;--line:#e4ddcd;--bg:#f5f2ea;--card:#fffdf8;--blue:#2b6ef2;--red:#7a2a24;--grn:#1b7f3b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.7}
.wrap{max-width:820px;margin:0 auto;padding:34px 20px 60px}
h1{font-size:24px;margin:0 0 4px}.lead{color:var(--sub);font-size:13.5px;margin:0 0 6px}
a.back{color:var(--blue);text-decoration:none;font-size:14px}
h2{font-size:19px;margin:26px 0 8px;border-left:5px solid var(--red);padding-left:10px;display:flex;justify-content:space-between;align-items:center}
h2 .tool{font-size:13px;font-weight:400}
h2 .tool button{border:1px solid var(--line);background:#fff;color:var(--blue);border-radius:14px;padding:2px 10px;cursor:pointer;font-size:12.5px}
.prog{height:10px;background:#e7e0cf;border-radius:6px;overflow:hidden;margin:4px 0 10px}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#2b6ef2,#1b7f3b)}
.pinfo{font-size:12.5px;color:var(--sub);margin:0 0 6px}
ul.tasks{list-style:none;margin:0;padding:0}
ul.tasks li{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin:6px 0}
ul.tasks label{display:flex;align-items:center;gap:8px;cursor:pointer}
ul.tasks input{width:18px;height:18px}
ul.tasks input:checked + span{color:var(--sub);text-decoration:line-through}
a.go{color:var(--blue);text-decoration:none;font-size:12.5px;white-space:nowrap;border:1px solid var(--line);border-radius:12px;padding:1px 9px}
a.go:hover{background:#eef4ff}
.tip{background:#eef4ff;border:1px solid #c9dcff;border-radius:12px;padding:10px 14px;font-size:13px;color:#33456a;margin:12px 0}
@media print{a.go,h2 .tool{display:none}body{background:#fff}.wrap{max-width:none}}
html.theme-dark{--ink:#e6e9ef;--sub:#a9b2c0;--line:#2c3442;--bg:#0f1319;--card:#151b24}
html.theme-dark h2 .tool button,html.theme-dark a.go{background:#1a212b;color:#9fc3ff;border-color:#2c3442}
html.theme-dark .prog{background:#2a3342}
</style></head><body><div class="wrap">
<h1>考研英语 · 学习任务清单</h1>
<p class="lead">勾选即可打卡，进度自动保存（本机）。可打印成纸质清单。</p>
<p><a class="back" href="kaoyan-hub.html">← 返回考研资料中心</a>　·　<a class="back" href="index.html">英语学习首页</a></p>
<div class="tip">建议节奏：每天 40–60 分钟；周一/三/五 阅读，周二/四 专项，周六 整套限时，周日 复盘。详见 <a href="kaoyan-hub.html">资料中心·月度/每周计划</a>。</div>

<h2>每日任务 <span class="tool"><button data-reset="daily">重置每日</button></span></h2>
<div class="prog" data-prog="daily"><i></i></div><p class="pinfo" data-info="daily"></p>
<ul class="tasks" data-group="daily"><li><label><input type="checkbox" data-id="d1"> <span>单词 25 个（词汇页，滚动复习）</span></label> <a class="go" href="kaoyan-vocab.html" target="_blank">打开</a></li><li><label><input type="checkbox" data-id="d2"> <span>长难句 1–2 句（真题精讲 · 四步拆句）</span></label> <a class="go" href="kaoyan-2025.html" target="_blank">打开</a></li><li><label><input type="checkbox" data-id="d3"> <span>错词本复习（词汇页错词本）</span></label> <a class="go" href="kaoyan-vocab.html" target="_blank">打开</a></li><li><label><input type="checkbox" data-id="d4"> <span>短语 5 条（真题精讲 · 短语表）</span></label> <a class="go" href="kaoyan-2026.html" target="_blank">打开</a></li></ul>

<h2>每周任务 <span class="tool"><button data-reset="weekly">重置本周</button></span></h2>
<div class="prog" data-prog="weekly"><i></i></div><p class="pinfo" data-info="weekly"></p>
<ul class="tasks" data-group="weekly"><li><label><input type="checkbox" data-id="w1"> <span>阅读限时 6 篇 + 精读（一/三/五 各 2 篇）</span></label> <a class="go" href="kaoyan-hub.html" target="_blank">打开</a></li><li><label><input type="checkbox" data-id="w2"> <span>语法 / 翻译 / 写作 轮换 3 次（二/四）</span></label> <a class="go" href="kaoyan-hub.html" target="_blank">打开</a></li><li><label><input type="checkbox" data-id="w3"> <span>整套或半套真题限时 1 次</span></label> <a class="go" href="kaoyan-hub.html" target="_blank">打开</a></li><li><label><input type="checkbox" data-id="w4"> <span>周日：错题本复盘 + 短语/词汇复习</span></label> <a class="go" href="kaoyan-vocab.html" target="_blank">打开</a></li><li><label><input type="checkbox" data-id="w5"> <span>写作仿写 / 默写 1 篇（五步法）</span></label> <a class="go" href="kaoyan-2026.html" target="_blank">打开</a></li></ul>

<h2>月度里程碑（M1–M15） <span class="tool"><button data-reset="month">重置</button></span></h2>
<div class="prog" data-prog="month"><i></i></div><p class="pinfo" data-info="month"></p>
<ul class="tasks" data-group="month"><li><label><input type="checkbox" data-id="m1"> <span>M1 择校完成，词汇启动（25/天）</span></label></li><li><label><input type="checkbox" data-id="m2"> <span>M2 核心词汇 1500 过一遍</span></label></li><li><label><input type="checkbox" data-id="m3"> <span>M3 语法讲义精讲完</span></label></li><li><label><input type="checkbox" data-id="m4"> <span>M4 长难句手册完成</span></label></li><li><label><input type="checkbox" data-id="m5"> <span>M5 阅读 25 篇</span></label></li><li><label><input type="checkbox" data-id="m6"> <span>M6 阅读 50 篇</span></label></li><li><label><input type="checkbox" data-id="m7"> <span>M7 真题 2010–2015 分套</span></label></li><li><label><input type="checkbox" data-id="m8"> <span>M8 真题 2016–2019 分套</span></label></li><li><label><input type="checkbox" data-id="m9"> <span>M9 翻译专项</span></label></li><li><label><input type="checkbox" data-id="m10"> <span>M10 写作专项（模板+仿写）</span></label></li><li><label><input type="checkbox" data-id="m11"> <span>M11 完型 / 新题型专项</span></label></li><li><label><input type="checkbox" data-id="m12"> <span>M12 真题 2020–2022 二刷</span></label></li><li><label><input type="checkbox" data-id="m13"> <span>M13 真题 2023–2024 精做</span></label></li><li><label><input type="checkbox" data-id="m14"> <span>M14 2025–2026 精讲 + 整套限时</span></label></li><li><label><input type="checkbox" data-id="m15"> <span>M15 冲刺课 + 背模板 + 查漏</span></label></li></ul>
</div>
<script>
(function(){
 var KEY='kytasks';var st={};try{st=JSON.parse(localStorage.getItem(KEY)||'{}')||{};}catch(e){st={};}
 function save(){try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){}}
 function box(id){return document.querySelector('input[data-id="'+id+'"]');}
 function group(id){return document.querySelector('ul[data-group="'+id+'"]');}
 function refresh(g){
  var els=group(g).querySelectorAll('input[data-id]');var n=0;els.forEach(function(e){if(e.checked)n++;});
  var bar=document.querySelector('[data-prog="'+g+'"] i');if(bar)bar.style.width=Math.round(100*n/els.length)+'%';
  var info=document.querySelector('[data-info="'+g+'"]');if(info)info.textContent='已完成 '+n+' / '+els.length;
 }
 function init(){
  document.querySelectorAll('input[data-id]').forEach(function(e){
   var id=e.getAttribute('data-id');e.checked=!!st[id];
   e.addEventListener('change',function(){st[id]=e.checked;save();refresh(e.closest('ul').getAttribute('data-group'));});
  });
  ['daily','weekly','month'].forEach(refresh);
  document.querySelectorAll('[data-reset]').forEach(function(b){
   b.addEventListener('click',function(){
    var g=b.getAttribute('data-reset');if(g==='daily')g='daily';if(g==='weekly')g='weekly';
    group(g).querySelectorAll('input[data-id]').forEach(function(e){var id=e.getAttribute('data-id');e.checked=false;delete st[id];});
    save();refresh(g);
   });
  });
 }
 document.addEventListener('DOMContentLoaded',init);
})();
</script></body></html>

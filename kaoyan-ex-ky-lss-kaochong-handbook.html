<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><title>考虫英语长难句特训手册（英语一） · 例题与解析（网页版）</title>
<style>
:root{--ink:#2c3038;--sub:#6b7280;--line:#e4ddcd;--bg:#f5f2ea;--card:#fffdf8;--blue:#2b6ef2;--red:#7a2a24}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.75}
.wrap{max-width:900px;margin:0 auto;padding:24px 16px 60px}
h1{font-size:22px;margin:0 0 4px}.lead{color:var(--sub);font-size:13px;margin:0 0 8px}
a.back{color:var(--blue);text-decoration:none;font-size:14px}
.tools{position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:5;border-bottom:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tools input{flex:1;min-width:160px;padding:7px 10px;border:1px solid var(--line);border-radius:10px;font-size:14px}
.tools button{border:1px solid var(--line);background:#fff;color:#234f7a;border-radius:10px;padding:6px 12px;cursor:pointer;font-size:13px}
h2.g{font-size:17px;margin:20px 0 6px;border-left:5px solid var(--red);padding-left:10px}
.muted{color:var(--sub);font-size:12.5px;font-weight:400}
.ex{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--red);border-radius:10px;padding:10px 14px;margin:10px 0}
.exq{margin:0 0 6px}
.opts{margin:4px 0;padding-left:6px}
.opt{font-size:14px}.opt.ok{color:#1b7f3b;font-weight:700}.opt.ok::after{content:'  ✓';}
details.sol{margin-top:6px;border-top:1px dashed var(--line);padding-top:4px}
details.sol summary{cursor:pointer;color:var(--blue);font-weight:600;font-size:13.5px}
details.sol p{margin:4px 0;font-size:14px}
mark{background:#fff3a3}
html.theme-dark{--ink:#e6e9ef;--sub:#a9b2c0;--line:#2c3442;--bg:#0f1319;--card:#151b24}
html.theme-dark .tools{background:#0f1319}
html.theme-dark .tools button{background:#1a212b;color:#dbe3ee;border-color:#2c3442}
@media print{.tools{display:none}details.sol{display:block}details.sol p{display:block}}
</style></head><body><div class="wrap">
<h1>考虫英语长难句特训手册（英语一） · 例题与解析（网页版）</h1>
<p class="lead">由讲义 OCR 提取的例题/练习与解析、译文（可能有识别误差，请对照原书 PDF）。</p>
<p><a class="back" href="kaoyan-reader.html">← 讲义在线阅读(PDF)</a>　·　<a class="back" href="kaoyan-ex.html">例题汇总</a>　·　<a class="back" href="kaoyan-drill-grammar.html">语法与长难句专项</a></p>
<div class="tools"><input id="q" type="search" placeholder="搜索题目/考点/解析…"><button id="find">筛选</button><span id="cnt" class="muted"></span></div>

</div>
<script>
document.getElementById('find').onclick=function(){
 var q=document.getElementById('q').value.trim().toLowerCase(),n=0;
 document.querySelectorAll('.ex').forEach(function(e){
  var ok=!q||e.textContent.toLowerCase().indexOf(q)>=0;e.style.display=ok?'':'none';if(ok)n++;
 });
 document.getElementById('cnt').textContent=q?('命中 '+n+' 题'):('共 '+document.querySelectorAll('.ex').length+' 题');
};
</script>
<script src="auth.js"></script>
</body></html>
